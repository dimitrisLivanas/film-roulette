<style>
/* Layout: one cinema-ticket pick panel on top, the full 100-film programme below with tick boxes. */
:root {
  color-scheme: light;
  --bg: #e8eaed;
  --surface: #f6f7f8;
  --ink: #14171c;
  --muted: #5a616b;
  --line: #cdd1d6;
  --accent: #c8312b;
  --accent-ink: #ffffff;
  --seen: #2f7d5b;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114;
    --surface: #171a1f;
    --ink: #eceef1;
    --muted: #9aa1ab;
    --line: #2a2f36;
    --accent: #ff5a4e;
    --accent-ink: #1a0807;
    --seen: #5bc495;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1114;
  --surface: #171a1f;
  --ink: #eceef1;
  --muted: #9aa1ab;
  --line: #2a2f36;
  --accent: #ff5a4e;
  --accent-ink: #1a0807;
  --seen: #5bc495;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.brand { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; margin: 0; font-weight: 400; text-wrap: balance; }
.brand em { color: var(--accent); }
.count { font-family: var(--font-data); font-size: 0.8125rem; color: var(--muted); letter-spacing: 0.02em; }
.count b { color: var(--ink); font-weight: 500; }

/* Ticket */
.ticket {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.ticket .main { padding: 24px 24px 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.eyebrow { font-family: var(--font-data); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.pick-title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2rem, 7vw, 3.25rem);
  line-height: 1.04;
  margin: 0;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.pick-meta { margin: 0; color: var(--muted); min-height: 1.5em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.btn {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 8px;
  padding: 10px 18px;
  font-weight: 600;
  font-size: 0.9375rem;
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn[hidden] { display: none; }
.stub {
  position: relative;
  border-left: 2px dashed var(--line);
  min-width: 132px;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  text-align: center;
}
.stub::before, .stub::after {
  content: "";
  position: absolute;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--line);
  left: -12px;
}
.stub::before { top: -12px; }
.stub::after { bottom: -12px; }
.stub .lab { font-family: var(--font-data); font-size: 0.6875rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.stub .num { font-family: var(--font-data); font-weight: 500; font-size: 2.75rem; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.stub .of { font-family: var(--font-data); font-size: 0.75rem; color: var(--muted); }
@media (max-width: 560px) {
  .ticket { grid-template-columns: minmax(0, 1fr); }
  .stub { border-left: 0; border-top: 2px dashed var(--line); flex-direction: row; gap: 12px; justify-content: center; padding: 14px 20px; min-width: 0; }
  .stub::before, .stub::after { top: -12px; bottom: auto; }
  .stub::before { left: -12px; }
  .stub::after { left: auto; right: -12px; }
  .stub .num { font-size: 2rem; }
  .ticket .main { padding: 20px 18px; }
}

.pickrow { display: flex; gap: 18px; align-items: flex-start; }
.pickrow .txt { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
.poster { flex: 0 0 auto; width: 120px; max-width: 30%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); }
.scores { display: flex; flex-wrap: wrap; gap: 4px 16px; font-family: var(--font-data); font-size: 0.8125rem; color: var(--muted); }
.scores b { font-weight: 500; color: var(--ink); }
.cast { margin: 0; font-size: 0.875rem; color: var(--muted); }
.plot { margin: 0; font-size: 0.9375rem; max-width: 60ch; }
.pickrow [hidden] { display: none; }

/* Programme */
.prog-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.prog-head h2 { margin: 0; font-size: 0.75rem; font-family: var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
ul.list { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
.row {
  display: grid;
  grid-template-columns: 28px 3.2ch minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px 14px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--line);
}
.tick {
  width: 24px; height: 24px;
  border: 1.5px solid var(--muted);
  border-radius: 6px;
  background: transparent;
  display: grid; place-items: center;
  padding: 0;
}
.tick::after { content: ""; width: 10px; height: 5px; border-left: 2px solid var(--bg); border-bottom: 2px solid var(--bg); transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.tick[aria-pressed="true"] { background: var(--seen); border-color: var(--seen); }
.tick[aria-pressed="true"]::after { opacity: 1; }
.rk { font-family: var(--font-data); font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta { display: flex; flex-direction: column; min-width: 0; }
.t { font-weight: 600; overflow-wrap: anywhere; }
.d { font-size: 0.8125rem; color: var(--muted); }
.yr { font-family: var(--font-data); font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.is-seen .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.row.is-current { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.none { color: var(--muted); padding: 22px 2px; margin: 0; }

footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; font-size: 0.8125rem; color: var(--muted); }
footer a { color: inherit; }
.link-btn { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--muted); font-size: inherit; }
.link-btn.danger { color: var(--accent); }
.sync { min-height: 1.2em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Views and tabs */
.view { display: flex; flex-direction: column; gap: 28px; }
.view[hidden] { display: none; }
.tabs { align-self: flex-start; }
.brand[hidden] { display: none; }

/* Books: warm paper palette, serif reading text, open-book spread instead of the ticket */
body[data-view="books"] {
  --bg: #ece5d6; --surface: #f7f2e7; --ink: #241e16; --muted: #6a6052; --line: #d3c9b4;
  --accent: #8a2f3b; --accent-ink: #ffffff; --seen: #3f6b4f;
  --font-read: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  body[data-view="books"] {
    --bg: #17130f; --surface: #201b15; --ink: #eee6d6; --muted: #a79d8b; --line: #363026;
    --accent: #e08a93; --accent-ink: #2a0b10; --seen: #7cc09a;
  }
}
.spread {
  display: grid;
  grid-template-columns: minmax(150px, 230px) minmax(0, 1fr);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 2px 0 var(--line);
}
.pg-l {
  padding: 26px 22px;
  display: flex; align-items: flex-start; justify-content: center;
  background: linear-gradient(to right, transparent 78%, color-mix(in srgb, var(--ink) 8%, transparent));
}
.pg-r {
  padding: 26px 28px 24px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
  border-left: 1px solid var(--line);
  background: linear-gradient(to left, transparent 94%, color-mix(in srgb, var(--ink) 5%, transparent));
}
.cover {
  position: relative; width: 100%; max-width: 180px; aspect-ratio: 2 / 3;
  border-radius: 2px 5px 5px 2px;
  box-shadow: 0 6px 16px rgb(0 0 0 / 0.22), inset 3px 0 0 rgb(255 255 255 / 0.14);
  background: hsl(var(--h, 20) 32% 26%);
  color: #f3ead8;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 14px 12px; overflow: hidden; text-align: center;
}
.cover .ct { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.1; overflow-wrap: anywhere; }
.cover .ca { font-family: var(--font-data); font-size: 0.625rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover img[hidden] { display: none; }
.bk-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.9rem); line-height: 1.05; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.bk-author { margin: 0; font-family: var(--font-read); font-style: italic; font-size: 1.125rem; color: var(--muted); }
.bk-facts { margin: 0; font-family: var(--font-data); font-size: 0.8125rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.bk-desc { margin: 0; font-family: var(--font-read); font-size: 1rem; line-height: 1.6; max-width: 62ch; }
.bk-status { margin: 0; font-size: 0.875rem; color: var(--muted); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips li { font-size: 0.75rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.spread [hidden] { display: none; }
a.btn { text-decoration: none; display: inline-block; color: inherit; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field {
  font: inherit; font-size: 0.875rem; color: var(--ink);
  background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
}
.field::placeholder { color: var(--muted); }
select.field { padding-right: 6px; }
.row.bk { grid-template-columns: 28px 3.2ch minmax(0, 1fr); }
.pickbtn { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; min-width: 0; width: 100%; }
.pickbtn:hover .t { text-decoration: underline; text-decoration-thickness: 1px; }
.row.is-seen .pickbtn .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
@media (max-width: 560px) {
  .spread { grid-template-columns: minmax(0, 1fr); }
  .pg-l { padding: 22px 18px 6px; justify-content: flex-start; background: none; }
  .pg-r { border-left: 0; padding: 14px 18px 20px; background: none; }
  .cover { max-width: 132px; }
}
.seg a { display: block; padding: 7px 14px; font-size: 0.875rem; font-weight: 500; color: var(--muted); text-decoration: none; }
.seg a + a { border-left: 1px solid var(--line); }
.seg a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tabs { align-self: flex-start; }
.badge { margin-left: 8px; font-family: var(--font-data); font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.row.is-reading .tick { border-color: var(--accent); }
.btn.on { border-color: var(--accent); color: var(--accent); }
</style>
</head>

<div class="wrap">
  <nav class="tabs seg" aria-label="Section">

  <header>
    <h1 class="brand">The Reading <em>List</em></h1>

<script>

100|Hard Times|Charles Dickens`;

const BOOKS = BOOK_RAW.split("\n").map(function (line) {
  const p = line.split("|");
  return { rank: Number(p[0]), title: p[1], author: p[2] };
});
const BOOK_BY = new Map(BOOKS.map(function (b) { return [b.rank, b]; }));
const READ_KEY = "film-roulette-read";
const READING_KEY = "film-roulette-reading";
const BSEL_KEY = "film-roulette-book";
const BMETA_KEY = "film-roulette-bookmeta-v1";
const CODE_KEY = "film-roulette-code";            // shared with the films page
const UPD_KEY = "film-roulette-books-updated";
const LINK_KEY = "film-roulette-books-linked";
const $ = function (id) { return document.getElementById(id); };
function pad(n) { return String(n).padStart(3, "0"); }

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// ---- Sync (Supabase). Config comes from config.js. ----
const CFG = window.SYNC_CONFIG || {};
const SUPABASE_URL = CFG.url || "";
const SUPABASE_KEY = CFG.key || "";
const SYNC_ON = !!(SUPABASE_URL && SUPABASE_KEY);

function readCode() {
  try {
    const m = location.hash.match(/code=([^&]+)/);
    if (m) {
      const c = decodeURIComponent(m[1]).trim();
      if (c) localStorage.setItem(CODE_KEY, c);
      history.replaceState(null, "", location.pathname + location.search);
    }
  } catch (e) {}
  return (lsGet(CODE_KEY) || "").trim();
}

let read = new Set(loadRead());
let reading = new Set(loadList(READING_KEY));
reading.forEach(function (n) { if (read.has(n)) reading.delete(n); });
let bookSel = BOOK_BY.has(Number(lsGet(BSEL_KEY))) ? Number(lsGet(BSEL_KEY)) : null;
let bookFilter = "all";
let bookQuery = "";
let bookSort = "list";
let syncCode = readCode();
let updated = Number(lsGet(UPD_KEY)) || 0;
let pushTimer = null;
let pushing = Promise.resolve();

function loadRead() {
  try {
    const v = JSON.parse(localStorage.getItem(READ_KEY) || "[]");
    return Array.isArray(v) ? v.filter(function (n) { return BOOK_BY.has(n); }) : [];
  } catch (e) { return []; }
}
function loadList(key) {
  try {
    const v = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(v) ? v.filter(function (n) { return BOOK_BY.has(n); }) : [];
  } catch (e) { return []; }
}
function saveLocal() {
  lsSet(READ_KEY, JSON.stringify(Array.from(read)));
  lsSet(READING_KEY, JSON.stringify(Array.from(reading)));
}
function setSync(msg) { $("sync").textContent = msg || ""; }
function remoteKey() { return syncCode + ":books"; }   // separate record from the films page
function touch() { updated = Date.now(); lsSet(UPD_KEY, String(updated)); }

function authHeaders() {
  const h = { "Content-Type": "application/json", apikey: SUPABASE_KEY };
  if (/^eyJ/.test(SUPABASE_KEY)) h.Authorization = "Bearer " + SUPABASE_KEY;
  return h;
}
function rpc(fn, body) {
  return fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify(body)
  }).then(function (r) {
    if (!r.ok) {
      return r.text().then(function (t) {
        let m = "";
        try { m = JSON.parse(t).message || ""; } catch (e) {}
        throw new Error("HTTP " + r.status + (m ? " " + m : ""));
      });
    }
    return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
  });
}
function snapshot() {
  return {
    read: Array.from(read).sort(function (a, b) { return a - b; }),
    reading: Array.from(reading).sort(function (a, b) { return a - b; }),
    updated: updated
  };
}
function syncing() { return SYNC_ON && !!syncCode; }
function schedulePush() {
  if (!syncing()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function () {
    pushTimer = null;
    const snap = snapshot();
    pushing = pushing.then(function () {
      return rpc("set_state", { k: remoteKey(), v: snap });
    }).then(function () {
      setSync("Synced across your devices.");
    }).catch(function (e) {
      setSync("Sync failed (" + e.message + "). Saved on this device.");
    });
  }, 300);
}
function persist() { saveLocal(); touch(); schedulePush(); }
function pull() {
  if (!syncing() || pushTimer) return Promise.resolve();
  return rpc("get_state", { k: remoteKey() }).then(function (v) {
    if (pushTimer) return;
    if (lsGet(LINK_KEY) !== syncCode) {
      // First time this device uses this code: merge both lists so nothing already marked is lost.
      if (v && Array.isArray(v.read)) v.read.forEach(function (n) { if (BOOK_BY.has(n)) read.add(n); });
      if (v && Array.isArray(v.reading)) v.reading.forEach(function (n) { if (BOOK_BY.has(n)) reading.add(n); });
      read.forEach(function (n) { reading.delete(n); });
      saveLocal();
      renderAll();
      lsSet(LINK_KEY, syncCode);
      touch();
      schedulePush();
      return;
    }
    if (v && typeof v === "object" && Number(v.updated) > updated) {
      read = new Set((Array.isArray(v.read) ? v.read : []).filter(function (n) { return BOOK_BY.has(n); }));
      reading = new Set((Array.isArray(v.reading) ? v.reading : []).filter(function (n) { return BOOK_BY.has(n) && !read.has(n); }));
      updated = Number(v.updated) || 0;
      lsSet(UPD_KEY, String(updated));
      saveLocal();
      renderAll();
      setSync("Synced across your devices.");
    } else if (!v || Number(v.updated) < updated) {
      schedulePush();
    } else {
      setSync("Synced across your devices.");
    }
  }).catch(function (e) {
    setSync("Sync failed (" + e.message + "). Saved on this device.");
  });
}
function syncLabel() {
  if (!SYNC_ON) return "Your read list is saved in this browser.";
  if (!syncCode) return "Saved in this browser. Add a sync code to share it across devices.";
  return "Syncing…";
}
function renderSyncUi() {
  setSync(syncLabel());
  const b = $("btnCode");
  b.hidden = !SYNC_ON;
  b.textContent = syncCode ? "Change sync code" : "Set sync code";
}
function askCode() {
  const c = window.prompt("Enter your sync code (use the same one on every device). Leave empty to turn sync off on this device.", syncCode);
  if (c === null) return;
  syncCode = c.trim();
  if (syncCode) lsSet(CODE_KEY, syncCode); else { try { localStorage.removeItem(CODE_KEY); } catch (e) {} }
  renderSyncUi();
  if (syncCode) pull();
}

function renderCount() {
  $("count").innerHTML = "<b>" + read.size + "</b> read · " +
    (reading.size ? "<b>" + reading.size + "</b> reading · " : "") +
    "<b>" + (100 - read.size) + "</b> to go";
}
function renderAll() { renderCount(); renderBooks(); }

// ---- Books ----
let BMETA = (function () {
  try { const v = JSON.parse(lsGet(BMETA_KEY) || "{}"); return v && typeof v === "object" ? v : {}; } catch (e) { return {}; }
})();
const BLOADING = {};
const BFAILED = {};

function surname(author) {
  const first = author.split(/ and /)[0].trim();
  const last = first.split(/\s+/).pop();
  return last;
}
function sortKey(b, how) {
  if (how === "title") return b.title.replace(/^(the|a|an)\s+/i, "").toLowerCase();
  return surname(b.author).toLowerCase() + " " + b.title.toLowerCase();
}
function olGet(url) {
  return fetch(url).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
function cleanDesc(d) {
  let t = typeof d === "string" ? d : (d && typeof d.value === "string" ? d.value : "");
  t = t.split(/\r?\n-{3,}|\r?\n\r?\n\(?\[?Source/i)[0];
  t = t.replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/[*_`#>]/g, "").replace(/\s+/g, " ").trim();
  if (t.length > 700) {
    const cut = t.slice(0, 700);
    const i = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
    t = i > 300 ? cut.slice(0, i + 1) : cut.replace(/\s+\S*$/, "") + "…";
  }
  return t;
}
function cleanSubjects(list) {
  const out = [];
  (Array.isArray(list) ? list : []).forEach(function (s) {
    if (typeof s !== "string") return;
    const t = s.trim();
    if (!t || t.length > 28) return;
    if (/^(nyt:|reading level|open_syllabus|large type|protected daisy|in library|accessible|lending library|internet archive|overdrive|series:|translations|.*\bcollection\b)/i.test(t)) return;
    if (/^[a-z]+:[^ ]/.test(t)) return;
    if (out.some(function (x) { return x.toLowerCase() === t.toLowerCase(); })) return;
    out.push(t);
  });
  return out.slice(0, 6);
}
function loadBookMeta(rank) {
  if (BMETA[rank]) return Promise.resolve(BMETA[rank]);
  if (BLOADING[rank]) return BLOADING[rank];
  const b = BOOK_BY.get(rank);
  const fix = { Dostoyevsky: "Dostoevsky", "Sun-Tzu": "Sun Tzu" };
  let au = surname(b.author);
  au = fix[au] || au;
  if (b.author === "Sun Tzu") au = "Sun Tzu";
  const url = "https://openlibrary.org/search.json?title=" + encodeURIComponent(b.title) +
    "&author=" + encodeURIComponent(au) +
    "&limit=5&fields=key,title,author_name,first_publish_year,cover_i,number_of_pages_median,subject,ratings_average,ratings_count";
  const p = olGet(url).then(function (d) {
    const docs = (d && d.docs) || [];
    const doc = docs.find(function (x) { return x.cover_i; }) || docs[0];
    if (!doc) { BFAILED[rank] = "notfound"; return null; }
    const meta = {
      key: doc.key || null,
      year: doc.first_publish_year || null,
      cover: doc.cover_i || null,
      pages: doc.number_of_pages_median || null,
      rating: doc.ratings_average ? Math.round(doc.ratings_average * 10) / 10 : null,
      ratings: doc.ratings_count || null,
      subjects: cleanSubjects(doc.subject),
      desc: ""
    };
    const worksUrl = doc.key ? "https://openlibrary.org" + doc.key + ".json" : null;
    const finish = function () {
      BMETA[rank] = meta;
      lsSet(BMETA_KEY, JSON.stringify(BMETA));
      delete BFAILED[rank];
      return meta;
    };
    if (!worksUrl) return finish();
    return olGet(worksUrl).then(function (w) {
      meta.desc = cleanDesc(w && w.description);
      const s = cleanSubjects(w && w.subjects);
      if (s.length >= 3) meta.subjects = s;
    }).catch(function () {}).then(finish);
  }).catch(function (e) {
    BFAILED[rank] = "network";
    return null;
  }).then(function (m) {
    delete BLOADING[rank];
    return m;
  });
  BLOADING[rank] = p;
  return p;
}

function setText(id, t) {
  const el = $(id);
  el.textContent = t || "";
  el.hidden = !t;
}
function renderSpread() {
  const b = bookSel ? BOOK_BY.get(bookSel) : null;
  const img = $("bkImg");
  if (!b) {
    $("bkCoverT").textContent = "";
    $("bkCoverA").textContent = "";
    $("bkCover").style.removeProperty("--h");
    img.hidden = true;
    img.removeAttribute("src");
    $("bkEyebrow").textContent = "Penguin’s 100 must-read classics";
    $("bkTitle").textContent = "Choose a book";
    $("bkAuthor").textContent = "Select any title in the list to see its details.";
    ["bkFacts", "bkStatus", "bkDesc"].forEach(function (id) { setText(id, ""); });
    $("bkSubjects").hidden = true;
    $("bkRead").hidden = true;
    $("bkReading").hidden = true;
    $("bkLink").hidden = true;
    return;
  }
  const m = BMETA[b.rank];
  const isRead = read.has(b.rank);
  const isReading = reading.has(b.rank);
  $("bkCover").style.setProperty("--h", String((b.rank * 47) % 360));
  $("bkCoverT").textContent = b.title;
  $("bkCoverA").textContent = b.author;
  if (m && m.cover) {
    img.onerror = function () { img.hidden = true; };
    img.src = "https://covers.openlibrary.org/b/id/" + m.cover + "-L.jpg";
    img.alt = "Cover of " + b.title;
    img.hidden = false;
  } else {
    img.hidden = true;
    img.removeAttribute("src");
  }
  $("bkEyebrow").textContent = "No. " + b.rank + " of 100" + (isRead ? " · Read" : isReading ? " · Reading now" : "");
  $("bkTitle").textContent = b.title;
  $("bkAuthor").textContent = b.author;
  const facts = $("bkFacts");
  facts.textContent = "";
  const items = [];
  if (m && m.year) items.push(["First published", String(m.year)]);
  if (m && m.pages) items.push(["Pages", String(m.pages)]);
  if (m && m.rating) items.push(["Rating", m.rating + "/5" + (m.ratings ? " (" + m.ratings.toLocaleString() + ")" : "")]);
  items.forEach(function (it) {
    const sp = document.createElement("span");
    sp.appendChild(document.createTextNode(it[0] + " "));
    const bb = document.createElement("b");
    bb.textContent = it[1];
    sp.appendChild(bb);
    facts.appendChild(sp);
  });
  facts.hidden = !items.length;
  let status = "";
  if (!m) {
    if (BLOADING[b.rank]) status = "Loading details…";
    else if (BFAILED[b.rank] === "notfound") status = "No details found for this one.";
    else if (BFAILED[b.rank]) status = "Couldn’t load details. Check your connection and select the book again.";
  }
  setText("bkStatus", status);
  setText("bkDesc", m && m.desc ? m.desc : "");
  const chips = $("bkSubjects");
  chips.textContent = "";
  ((m && m.subjects) || []).forEach(function (s) {
    const li = document.createElement("li");
    li.textContent = s;
    chips.appendChild(li);
  });
  chips.hidden = !chips.children.length;
  const rb = $("bkRead");
  rb.hidden = false;
  rb.textContent = isRead ? "Marked as read · undo" : "Mark as read";
  rb.className = isReading ? "btn primary" : "btn";
  const gb = $("bkReading");
  gb.hidden = isRead;
  gb.textContent = isReading ? "Reading now · stop" : "Start reading";
  gb.className = isReading ? "btn on" : "btn primary";
  const link = $("bkLink");
  link.href = m && m.key ? "https://openlibrary.org" + m.key : "https://openlibrary.org/search?q=" + encodeURIComponent(b.title + " " + b.author);
  link.hidden = false;
}

function visibleBooks() {
  const q = bookQuery.trim().toLowerCase();
  const rows = BOOKS.filter(function (b) {
    const r = read.has(b.rank);
    const g = reading.has(b.rank);
    if (bookFilter === "read" && !r) return false;
    if (bookFilter === "reading" && !g) return false;
    if (bookFilter === "unread" && (r || g)) return false;
    return !q || b.title.toLowerCase().indexOf(q) !== -1 || b.author.toLowerCase().indexOf(q) !== -1;
  });
  if (bookSort !== "list") {
    rows.sort(function (a, b) {
      const x = sortKey(a, bookSort), y = sortKey(b, bookSort);
      return x < y ? -1 : x > y ? 1 : 0;
    });
  }
  return rows;
}

function renderBooks(focusRank, focusKind) {
  renderSpread();
  const ul = $("bkList");
  const rows = visibleBooks();
  if (!rows.length) {
    ul.innerHTML = "";
    const li = document.createElement("li");
    li.className = "none";
    li.textContent = bookQuery.trim() ? "No books match that search." : bookFilter === "read" ? "Nothing marked as read yet." : bookFilter === "reading" ? "Nothing in progress. Open a book and choose Start reading." : "No unread books left.";
    ul.appendChild(li);
    return;
  }
  const frag = document.createDocumentFragment();
  rows.forEach(function (b) {
    const r = read.has(b.rank);
    const li = document.createElement("li");
    const g = reading.has(b.rank);
    li.className = "row bk" + (r ? " is-seen" : "") + (g ? " is-reading" : "") + (bookSel === b.rank ? " is-current" : "");
    const tick = document.createElement("button");
    tick.type = "button";
    tick.className = "tick";
    tick.dataset.rank = b.rank;
    tick.setAttribute("aria-pressed", r ? "true" : "false");
    tick.setAttribute("aria-label", (r ? "Read: " : "Mark as read: ") + b.title);
    const rk = document.createElement("span");
    rk.className = "rk";
    rk.textContent = pad(b.rank);
    const pick = document.createElement("button");
    pick.type = "button";
    pick.className = "pickbtn";
    pick.dataset.rank = b.rank;
    if (bookSel === b.rank) pick.setAttribute("aria-current", "true");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = b.title;
    const d = document.createElement("span");
    d.className = "d";
    d.textContent = b.author;
    if (g) {
      const bd = document.createElement("span");
      bd.className = "badge";
      bd.textContent = "Reading";
      d.appendChild(bd);
    }
    pick.appendChild(t);
    pick.appendChild(d);
    li.appendChild(tick);
    li.appendChild(rk);
    li.appendChild(pick);
    frag.appendChild(li);
  });
  ul.innerHTML = "";
  ul.appendChild(frag);
  if (focusRank != null) {
    const el = ul.querySelector((focusKind === "pick" ? ".pickbtn" : ".tick") + '[data-rank="' + focusRank + '"]');
    if (el) el.focus({ preventScroll: true });
  }
}

function selectBook(rank) {
  bookSel = rank;
  lsSet(BSEL_KEY, String(rank));
  renderBooks(rank, "pick");
  const sp = $("spread");
  if (sp.getBoundingClientRect().top < 0) {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    sp.scrollIntoView({ block: "start", behavior: reduce ? "auto" : "smooth" });
  }
  if (!BMETA[rank]) {
    loadBookMeta(rank).then(function () { if (bookSel === rank) renderSpread(); });
  }
}
function toggleReading(rank, focusKind) {
  if (reading.has(rank)) reading.delete(rank); else { reading.add(rank); read.delete(rank); }
  persist();
  renderCount();
  renderBooks(rank, focusKind || "pick");
}
function toggleRead(rank, focusKind) {
  if (read.has(rank)) read.delete(rank); else { read.add(rank); reading.delete(rank); }
  persist();
  renderCount();
  renderBooks(rank, focusKind || "tick");
}


let resetArmed = false;
let resetTimer = null;
function disarm() {
  resetArmed = false;
  clearTimeout(resetTimer);
  $("btnReset").textContent = "Clear read list";
  $("btnReset").classList.remove("danger");
}
$("btnReset").addEventListener("click", function () {
  const btn = $("btnReset");
  if (!read.size && !reading.size) return;
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = "Tap again to clear all " + read.size + " read" + (reading.size ? " and " + reading.size + " in progress" : "") + " books";
    btn.classList.add("danger");
    resetTimer = setTimeout(disarm, 4000);
    return;
  }
  disarm();
  read = new Set();
  reading = new Set();
  persist();
  renderAll();
});
$("btnCode").addEventListener("click", askCode);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") pull();
});
$("bkList").addEventListener("click", function (e) {
  const t = e.target.closest(".tick");
  if (t) { toggleRead(Number(t.dataset.rank), "tick"); return; }
  const pk = e.target.closest(".pickbtn");
  if (pk) selectBook(Number(pk.dataset.rank));
});
$("bkRead").addEventListener("click", function () { if (bookSel) toggleRead(bookSel, "pick"); });
$("bkReading").addEventListener("click", function () { if (bookSel) toggleReading(bookSel, "pick"); });
$("bkSearch").addEventListener("input", function (e) { bookQuery = e.target.value; renderBooks(); });
$("bkSort").addEventListener("change", function (e) { bookSort = e.target.value; renderBooks(); });
document.querySelectorAll("[data-bfilter]").forEach(function (b) {
  b.addEventListener("click", function () {
    bookFilter = b.dataset.bfilter;
    document.querySelectorAll("[data-bfilter]").forEach(function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    renderBooks();
  });
});

renderAll();
renderSyncUi();
pull();
if (bookSel && !BMETA[bookSel]) {
  const r0 = bookSel;
  loadBookMeta(r0).then(function () { if (bookSel === r0) renderSpread(); });
}
</script>
